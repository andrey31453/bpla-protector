name: Deploy to GitHub Pages

# Витрина всех вариантов лендингов. Рабочая ветка — develop: сюда попадают все
# сборки сайтов, здесь их и смотрит команда. Боевая выкладка на хостинг живёт
# в ветке main — .github/workflows/deploy-hosting.yml.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all sites
        run: ./saits/build.sh

      - name: Assemble hub
        run: node saits/assemble.mjs saits

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: saits/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
