; Установить в /etc/php/<версия>/fpm/pool.d/site-lead.conf (PHP 8.1+)
[site-lead]
user = www-data
group = www-data
listen = /run/php/site-lead.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
request_terminate_timeout = 30s
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on