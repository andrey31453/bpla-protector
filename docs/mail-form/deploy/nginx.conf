# Подключить внутри server {}, root должен указывать на корень собранного сайта.
location = /api/lead.php {
    client_max_body_size 16k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/api/lead.php;
    fastcgi_pass unix:/run/php/site-lead.sock;
    fastcgi_read_timeout 30s;
}

# Закрывает конфигурацию и исходники прочих PHP-файлов.
location ~* \.php(?:/|$) {
    return 404;
}