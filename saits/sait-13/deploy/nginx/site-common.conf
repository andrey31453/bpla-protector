# ============================================================
# Общая часть виртуального хоста sait-13 (домен zok.pro).
#
# Кладётся в /etc/nginx/snippets/site-common.conf и подключается через include
# из каждого server-блока, который отдаёт сайт: :80 по IP (диагностика) и :443
# по домену. Так документ-рут, кеш, gzip и заголовки описаны в одном месте и
# HTTP- и HTTPS-блоки не расходятся при правках.
#
# Ставит файл deploy/install-tls.sh — вместе с nginx/site.conf и сертификатом.
# Вручную на сервер ничего не копируется.
# ============================================================

root /var/www/site;
index index.html;

charset utf-8;
server_tokens off;

access_log /var/log/nginx/site.access.log;
error_log /var/log/nginx/site.error.log warn;

# Стейдж закрыт от индексации: заголовок действует и на файлы без <meta>
# (PDF, картинки). Пока в hosting.json "staging": true — строка нужна; при
# снятии стейджа удаляется только она (deploy/README.md, раздел 5, шаг 3).
add_header X-Robots-Tag "noindex, nofollow" always;

# Заголовки безопасности. ВАЖНО: свой add_header внутри location отменяет
# наследование всех add_header сервера, поэтому в locations ниже их нет —
# там только expires (он наследование не сбрасывает).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

# Файлы Vite с хешем в имени (assets/*.a1b2c3.js) не меняются никогда.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Иконки и картинки: имя без хеша, поэтому короткий кеш.
location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
    expires 7d;
    try_files $uri =404;
}

# HTML не кешируем: после выкладки посетитель сразу видит новую версию.
location ~* \.html$ {
    expires -1;
    try_files $uri =404;
}

# Чистые адреса: /mosty → mosty.html (сборка кладёт страницы файлами .html),
# / → index.html. favicon.ico и robots.txt находятся правилом $uri.
location / {
    try_files $uri $uri.html $uri/ =404;
}

# Служебные файлы разработки наружу не отдаём (.git, .env и подобное),
# /.well-known оставляем открытым: там живут проверки домена.
location ~ /\.(?!well-known) {
    deny all;
}
