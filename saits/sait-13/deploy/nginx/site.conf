# ============================================================
# Сайт sait-13 на nginx: статика из /var/www/site, боевой домен — zok.pro.
#
# Кладётся в /etc/nginx/sites-available/site.conf и включается симлинком в
# sites-enabled — это делает deploy/bootstrap.sh.
#
# Сейчас A-записи домена ещё нет, поэтому блок остаётся default_server: он
# отвечает и по IP, и на Host zok.pro, а сайт закрыт от индексации заголовком
# X-Robots-Tag и noindex в страницах (staging: true в hosting.json).
#
# Переезд на домен: A-запись zok.pro → 177.177.212.73, `default_server` убрать,
# certbot --nginx -d zok.pro -d www.zok.pro, снять X-Robots-Tag, в hosting.json
# staging: false. Подробно — deploy/README.md, раздел «Переезд на домен zok.pro».
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Домен боевой, но пока без A-записи: default_server принимает и IP, и
    # zok.pro/www.zok.pro. После привязки домена слово default_server убрать.
    server_name zok.pro www.zok.pro;

    root /var/www/site;
    index index.html;

    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/site.access.log;
    error_log /var/log/nginx/site.error.log warn;

    # Стейдж не индексируется: заголовок действует и на файлы без <meta>
    # (PDF, картинки). После переезда на домен строку убрать.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Заголовки безопасности. ВАЖНО: свой add_header внутри location отменяет
    # наследование всех add_header сервера, поэтому в locations ниже их нет —
    # там только expires (он наследование не сбрасывает).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Файлы Vite с хешем в имени (assets/*.a1b2c3.js) не меняются никогда.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Иконки и картинки: имя без хеша, поэтому короткий кеш.
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML не кешируем: после выкладки посетитель сразу видит новую версию.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Чистые адреса: /mosty → mosty.html (сборка кладёт страницы файлами .html),
    # / → index.html. favicon.ico и robots.txt находятся правилом $uri.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Служебные файлы разработки наружу не отдаём (.git, .env и подобное).
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ============================================================
# Блок для HTTPS — включается на шаге «домен»: `certbot --nginx` дописывает
# такой блок сам, а этот шаблон нужен, если сертификат уже есть.
