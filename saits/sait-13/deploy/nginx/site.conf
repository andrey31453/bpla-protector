# ============================================================
# Сайт sait-13 на nginx: статика из /var/www/site, домен https://zok.pro.
#
# Кладётся в /etc/nginx/sites-available/site.conf и включается симлинком в
# sites-enabled. Общая часть (документ-рут, кеш, gzip, заголовки) — в
# nginx/site-common.conf, он же ставится в /etc/nginx/snippets/. Оба файла и
# сертификат ставит deploy/install-tls.sh — вручную на сервер ничего не
# копируется (deploy/README.md, раздел 5).
#
# Четыре server-блока:
#   1) :80  default_server — IP и любой незнакомый Host: отдаёт сайт, чтобы
#      диагностика работала даже при сломанном DNS, и закрыт от индексации;
#   2) :80  zok.pro, www.zok.pro — постоянный редирект на HTTPS;
#   3) :443 zok.pro, www.zok.pro — боевой сайт по сертификату GlobalSign
#      (AlphaSSL, SAN zok.pro + www.zok.pro); www уводится на zok.pro,
#      чтобы адрес в поиске был один — как в canonical;
#   4) :443 default_server — запросы по IP и на чужой Host: соединение
#      сбрасывается (444), дубля контента по IP нет.
#
# Сертификат не продлевается автоматически (это не Let's Encrypt): срок и
# порядок перевыпуска — deploy/README.md, раздел 5, «Продление сертификата».
# ============================================================

# ---------- 1. IP и незнакомые Host по HTTP: сайт для диагностики ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    include /etc/nginx/snippets/site-common.conf;
}

# ---------- 2. Домен по HTTP: только редирект на HTTPS ----------
server {
    listen 80;
    listen [::]:80;

    server_name zok.pro www.zok.pro;

    # Проверку домена (HTTP-01 у ACME) редиректить нельзя — иначе она не
    # пройдёт, если сертификат когда-нибудь переедет на Let's Encrypt.
    # Каталог пустой, пока проверок нет: отдаётся 404, а не страница сайта.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 3. Домен по HTTPS: боевой сайт ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name zok.pro www.zok.pro;

    # Один сертификат на оба имени (SAN zok.pro + www.zok.pro). Пути задаёт
    # install-tls.sh: fullchain.pem — лист + промежуточный сертификат,
    # privkey.pem — приватный ключ (права 600, владелец root).
    ssl_certificate     /etc/ssl/zok.pro/fullchain.pem;
    ssl_certificate_key /etc/ssl/zok.pro/privkey.pem;

    # TLS 1.2 + 1.3, только ECDHE. TLS 1.0/1.1 отключены: современные браузеры
    # их не поддерживают, а старые клиенты для статики не нужны.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Сессионный кеш: без него каждый запрос — новый handshake. Tickets
    # выключены: они ослабляют forward secrecy.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: браузер год ходит на zok.pro только по HTTPS. Без preload — в
    # список HSTS preload домен не добавляем.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # www — только редирект: canonical сайта один, https://zok.pro.
    if ($host = www.zok.pro) {
        return 301 https://zok.pro$request_uri;
    }

    include /etc/nginx/snippets/site-common.conf;
}

# ---------- 4. HTTPS по IP и на чужой Host: соединение сбрасывается ----------
# Сертификат на IP не выдают, а отдавать сайт по IP незачем: дубль контента
# и лишний адрес в поиске. 444 — nginx закрывает соединение без ответа.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name _;

    ssl_certificate     /etc/ssl/zok.pro/fullchain.pem;
    ssl_certificate_key /etc/ssl/zok.pro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
